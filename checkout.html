<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#c8607a" />

  <!-- SEO -->
  <title>Commande — Lumière Beauté</title>
  <meta name="description" content="Finalisez votre commande Lumière. Livraison rapide au Maroc. Paiement sécurisé en Dirhams (MAD)." />
  <meta name="robots" content="noindex" />

  <!-- Preconnect for fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="src/styles/variables.css?v=34" />
  <link rel="stylesheet" href="src/styles/global.css?v=34" />
  <link rel="stylesheet" href="src/styles/components.css?v=34" />
  <link rel="stylesheet" href="src/styles/header.css?v=34" />
  <link rel="stylesheet" href="src/styles/hero.css?v=34" />
  <link rel="stylesheet" href="src/styles/cart.css?v=34" />
  <link rel="stylesheet" href="src/styles/checkout.css?v=34" />
</head>

<body>
  <!-- Header (Inline SVG Wordmark + Hydrated Nav) -->
  <div id="header-root">
    <header class="header" role="banner">
      <div class="header__main">
        <div class="container">
          <div class="header__inner">
            <a href="/" class="header-logo-link header__logo" aria-label="Lumière">
              <svg class="header-logo-svg" viewBox="0 0 156 38" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lumière" direction="ltr">
                <text x="50%" y="28" text-anchor="middle" fill="currentColor" font-family="Playfair Display, Didot, Georgia, serif" font-size="28" font-weight="600" letter-spacing="0.05em">Lumière</text>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </header>
  </div>

  <!-- Checkout page root (injected by checkout.js) -->
  <div id="checkout-root" class="checkout-page"></div>

  <!-- Footer -->
  <footer class="site-footer" role="contentinfo" style="margin-top:var(--sp-16);">
    <div class="container">
      <p>
        <span class="site-footer__brand" data-i18n="footer.brand">Lumière</span>
        — <span data-i18n="footer.tagline">Soins d'exception importés directement de Turquie pour sublimer votre peau et vos cheveux au quotidien.</span>
      </p>
      <p class="site-footer__copy">
        © 2026 <span data-i18n="footer.brand">Lumière</span>. <span data-i18n="footer.rights">Tous droits réservés.</span>
        · <span style="color:var(--color-primary);">🔒 <span data-i18n="footer.ssl">Paiement à la livraison & SSL sécurisé</span> · 🇲🇦 <span data-i18n="footer.prices">Tous les prix en DH (MAD)</span></span>
      </p>
    </div>
  </footer>

  <!-- Checkout entry point -->
  <script type="module" src="src/pages/checkout.js?v=26"></script>
</body>
</html>
