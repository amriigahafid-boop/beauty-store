<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#c8607a" />

  <!-- SEO -->
  <title>Lumière — Beauté & Cosmétiques Premium | متجر الجمال</title>
  <meta name="description" content="Votre destination beauté premium au Maroc. Soins naturels, maquillage de luxe et parfums d'exception en Dirhams marocains. متجر الجمال الفاخر بالدرهم المغربي." />
  <meta name="keywords" content="beauté, cosmétiques, soin de la peau, maquillage, parfums, argan, MAD, جمال, عناية بالبشرة, درهم" />

  <!-- Open Graph -->
  <meta property="og:title"       content="Lumière — Beauté Premium" />
  <meta property="og:description" content="Votre destination beauté premium. Tous les prix en Dirhams marocains (MAD)." />
  <meta property="og:type"        content="website" />

  <!-- Preconnect for fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets (order matters) -->
  <link rel="stylesheet" href="src/styles/variables.css?v=34" />
  <link rel="stylesheet" href="src/styles/global.css?v=34" />
  <link rel="stylesheet" href="src/styles/components.css?v=34" />
  <link rel="stylesheet" href="src/styles/header.css?v=34" />
  <link rel="stylesheet" href="src/styles/hero.css?v=34" />
  <link rel="stylesheet" href="src/styles/shop.css?v=34" />
  <link rel="stylesheet" href="src/styles/home-sections.css?v=34" />
  <link rel="stylesheet" href="src/styles/cart.css?v=34" />
</head>

<body>
  <!-- ╔══════════════════════════════════════════════╗ -->
  <!-- ║  HEADER (Inline SVG Wordmark + Hydrated Nav) ║ -->
  <!-- ╚══════════════════════════════════════════════╝ -->
  <div id="header-root">
    <header class="header" role="banner">
      <div class="header__main">
        <div class="container">
          <div class="header__inner">
            <a href="/" class="header-logo-link header__logo" aria-label="Lumière">
              <svg class="header-logo-svg" viewBox="0 0 156 38" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lumière" direction="ltr">
                <text x="50%" y="28" text-anchor="middle" fill="currentColor" font-family="Playfair Display, Didot, Georgia, serif" font-size="28" font-weight="600" letter-spacing="0.05em">Lumière</text>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </header>
  </div>

  <main id="main-content">

    <!-- ╔══════════════════════════════════════════════╗ -->
    <!-- ║  STATIC LUXURY HERO BANNER                   ║ -->
    <!-- ╚══════════════════════════════════════════════╝ -->
    <section class="hero-static-banner" id="hero" aria-labelledby="hero-heading">
      <img
        src="/public/images/banners/lumiere-editorial-hair.jpg"
        alt=""
        class="hero-bg-img"
        aria-hidden="true"
        loading="eager"
        decoding="async"
        onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src=this.getAttribute('src').replace('/public/','/');}"
      />
      <div class="hero-content">
        <span class="hero-tag" data-i18n="hero.tag">Collection Privée • Turquie</span>
        <h1 class="hero-title" id="hero-heading" data-i18n="hero.title">L'Art du Soin Botanique</h1>
        <a href="#products-grid" class="hero-cta-btn" data-i18n="hero.cta">Explorer la Boutique</a>
      </div>
    </section>

    <!-- ╔══════════════════════════════════════════════╗ -->
    <!-- ║  SHOP SECTION (injected by ShopSection.js)  ║ -->
    <!-- ╚══════════════════════════════════════════════╝ -->
    <div id="shop-root"></div>

    <!-- ╔══════════════════════════════════════════════╗ -->
    <!-- ║  TOP HOMEPAGE SECTIONS (Concerns & Brands)  ║ -->
    <!-- ╚══════════════════════════════════════════════╝ -->
    <div id="home-top-sections"></div>

    <!-- ╔══════════════════════════════════════════════╗ -->
    <!-- ║  BOTTOM SECTIONS (Bundles, Reviews & FAQ)   ║ -->
    <!-- ╚══════════════════════════════════════════════╝ -->
    <div id="home-bottom-sections"></div>

  </main>

  <!-- ╔══════════════════════════════════════════════╗ -->
  <!-- ║  FOOTER                                      ║ -->
  <!-- ╚══════════════════════════════════════════════╝ -->
  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <p>
        <span class="site-footer__brand" data-i18n="footer.brand">Lumière</span>
        — <span data-i18n="footer.tagline">Soins d'exception importés directement de Turquie pour sublimer votre peau au quotidien.</span>
      </p>
      <p class="site-footer__copy">
        © 2026 <span data-i18n="footer.brand">Lumière</span>. <span data-i18n="footer.rights">Tous droits réservés.</span>
        · <span style="color:var(--color-primary);">🇲🇦 <span data-i18n="footer.prices">Tous les prix en DH (MAD)</span></span>
      </p>
    </div>
  </footer>

  <!-- App entry point -->
  <script type="module" src="src/main.js?v=34"></script>
</body>
</html>
