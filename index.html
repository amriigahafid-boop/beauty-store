<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#c8607a" />

  <!-- SEO -->
  <title>Lumière — Beauté & Cosmétiques Premium | متجر الجمال</title>
  <meta name="description" content="Votre destination beauté premium au Maroc. Soins naturels, maquillage de luxe et parfums d'exception en Dirhams marocains. متجر الجمال الفاخر بالدرهم المغربي." />
  <meta name="keywords" content="beauté, cosmétiques, soin de la peau, maquillage, parfums, argan, MAD, جمال, عناية بالبشرة, درهم" />

  <!-- Open Graph -->
  <meta property="og:title"       content="Lumière — Beauté Premium" />
  <meta property="og:description" content="Votre destination beauté premium. Tous les prix en Dirhams marocains (MAD)." />
  <meta property="og:type"        content="website" />

  <!-- Preconnect for fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets (order matters) -->
  <link rel="stylesheet" href="src/styles/variables.css?v=26" />
  <link rel="stylesheet" href="src/styles/global.css?v=26" />
  <link rel="stylesheet" href="src/styles/components.css?v=26" />
  <link rel="stylesheet" href="src/styles/header.css?v=26" />
  <link rel="stylesheet" href="src/styles/hero.css?v=26" />
  <link rel="stylesheet" href="src/styles/shop.css?v=26" />
  <link rel="stylesheet" href="src/styles/home-sections.css?v=26" />
  <link rel="stylesheet" href="src/styles/cart.css?v=26" />
</head>

<body>
  <!-- ╔══════════════════════════════════════════════╗ -->
  <!-- ║  HEADER (injected by JS)                     ║ -->
  <!-- ╚══════════════════════════════════════════════╝ -->
  <div id="header-root"></div>

  <main id="main-content">

    <!-- ╔══════════════════════════════════════════════╗ -->
    <!-- ║  HERO CAROUSEL                               ║ -->
    <!-- ╚══════════════════════════════════════════════╝ -->
    <section class="hero" id="hero" aria-labelledby="hero-heading">
      <div id="hero-carousel-root"></div>
    </section>

    <!-- ╔══════════════════════════════════════════════╗ -->
    <!-- ║  SHOP SECTION (injected by ShopSection.js)  ║ -->
    <!-- ╚══════════════════════════════════════════════╝ -->
    <div id="shop-root"></div>

    <!-- ╔══════════════════════════════════════════════╗ -->
    <!-- ║  TOP HOMEPAGE SECTIONS (Concerns & Brands)  ║ -->
    <!-- ╚══════════════════════════════════════════════╝ -->
    <div id="home-top-sections"></div>

    <!-- ╔══════════════════════════════════════════════╗ -->
    <!-- ║  BOTTOM SECTIONS (Bundles, Reviews & FAQ)   ║ -->
    <!-- ╚══════════════════════════════════════════════╝ -->
    <div id="home-bottom-sections"></div>

  </main>

  <!-- ╔══════════════════════════════════════════════╗ -->
  <!-- ║  FOOTER                                      ║ -->
  <!-- ╚══════════════════════════════════════════════╝ -->
  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <p>
        <span class="site-footer__brand" data-i18n="footer.brand">Lumière</span>
        — <span data-i18n="footer.tagline">Soins d'exception importés directement de Turquie pour sublimer votre peau au quotidien.</span>
      </p>
      <p class="site-footer__copy">
        © 2026 <span data-i18n="footer.brand">Lumière</span>. <span data-i18n="footer.rights">Tous droits réservés.</span>
        · <span style="color:var(--color-primary);">🇲🇦 <span data-i18n="footer.prices">Tous les prix en DH (MAD)</span></span>
      </p>
    </div>
  </footer>

  <!-- App entry point -->
  <script type="module" src="src/main.js?v=26"></script>
</body>
</html>
