<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#c8607a" />

  <!-- SEO -->
  <title>Lumière — Beauté & Cosmétiques Premium | متجر الجمال</title>
  <meta name="description" content="Votre destination beauté premium au Maroc. Soins naturels, maquillage de luxe et parfums d'exception en Dirhams marocains. متجر الجمال الفاخر بالدرهم المغربي." />
  <meta name="keywords" content="beauté, cosmétiques, soin de la peau, maquillage, parfums, argan, MAD, جمال, عناية بالبشرة, درهم" />

  <!-- Open Graph -->
  <meta property="og:title"       content="Lumière — Beauté Premium" />
  <meta property="og:description" content="Votre destination beauté premium. Tous les prix en Dirhams marocains (MAD)." />
  <meta property="og:type"        content="website" />

  <!-- Preconnect for fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Stylesheets (order matters) -->
  <link rel="stylesheet" href="src/styles/variables.css" />
  <link rel="stylesheet" href="src/styles/global.css" />
  <link rel="stylesheet" href="src/styles/components.css" />
  <link rel="stylesheet" href="src/styles/header.css" />
  <link rel="stylesheet" href="src/styles/hero.css" />
  <link rel="stylesheet" href="src/styles/shop.css" />
  <link rel="stylesheet" href="src/styles/cart.css" />
</head>

<body>
  <!-- ╔══════════════════════════════════════════════╗ -->
  <!-- ║  HEADER (injected by JS)                     ║ -->
  <!-- ╚══════════════════════════════════════════════╝ -->
  <div id="header-root"></div>

  <main id="main-content">

    <!-- ╔══════════════════════════════════════════════╗ -->
    <!-- ║  HERO (mounted by HeroSlider via main.js)    ║ -->
    <!-- ╚══════════════════════════════════════════════╝ -->
    <div id="hero-root"></div>


    <!-- ╔══════════════════════════════════════════════╗ -->
    <!-- ║  SHOP SECTION (injected by ShopSection.js)  ║ -->
    <!-- ╚══════════════════════════════════════════════╝ -->
    <div id="shop-root"></div>

  </main>

  <!-- ╔══════════════════════════════════════════════╗ -->
  <!-- ║  FOOTER                                      ║ -->
  <!-- ╚══════════════════════════════════════════════╝ -->
  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <p>
        <span class="site-footer__brand">Lumière</span>
        — <span data-i18n="footer.tagline">Votre destination beauté premium.</span>
      </p>
      <p class="site-footer__copy">
        © 2026 Lumière. <span data-i18n="footer.rights">Tous droits réservés.</span>
        · <span style="color:var(--color-primary);">🇲🇦 Tous les prix en DH (MAD)</span>
      </p>
    </div>
  </footer>

  <!-- App entry point -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
